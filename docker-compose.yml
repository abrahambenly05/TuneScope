services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tunescope
      POSTGRES_PASSWORD: tunescope
      POSTGRES_DB: tunescope
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tunescope"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data: